version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    # no automated version-update PRs; deps are deliberately pinned via
    # Gemfile.lock and refreshed in controlled re-lock PRs
    open-pull-requests-limit: 0
    ignore:
      # relaton 3.0.0.pre.alpha.4 pins faraday (~> 2.7.0), so Dependabot's
      # security update for faraday can never resolve and the run fails;
      # the advisory is not relevant to these sample-document builds
      - dependency-name: faraday
